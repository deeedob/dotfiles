################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,highrr,auto,auto


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun
$browser = firefox
$cursor_theme = Bibata-Modern-TokyoNight


#################
### AUTOSTART ###
#################

# style
exec-once = gsettings set org.gnome.desktop.interface cursor-theme '$cursor_theme'
exec-once = systemctl --user start plasma-polkit-agent
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# applets
exec-once = nm-applet
exec-once = blueman-applet
# clipboard history
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# apps
exec-once = hypridle
exec-once = hyprpaper
exec-once = waybar
exec-once = dunst
exec-once = bash -c "sleep 3 && nextcloud --background &"

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

# env = HYPRCURSOR_THEME, $cursor_theme
env = HYPRCURSOR_SIZE, 24
env = XCURSOR_THEME, $cursor_theme
env = XCURSOR_SIZE, 24
env = GTK_THEME, Kanagawa

env = XDG_SESSION_TYPE, wayland
env = QT_QPA_PLATFORM, wayland
env = GDK_BACKEND, wayland

env = _JAVA_AWT_WM_NONREPARENTING, 1
env = WLR_BACKEND, vulkan


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 3
    no_border_on_floating = false

    col.active_border = rgba(5e548eff) rgba(1D2021ff) 25deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = true
    extend_border_grab_area = 5

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    drop_shadow = true
    shadow_range = 6
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 5
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    allow_small_split = true
    orientation = center
    always_center_master = true
    new_status = slave
    new_on_active = none
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,de
    kb_variant =
    kb_model =
    kb_options = shift:both_shiftlock,ctrl:nocaps,altwin:swap_lalt_lwin,grp:ctrl_alt_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
	disable_while_typing = true
	drag_lock = true
	tap-and-drag = true
	middle_button_emulation = true
    }
}

cursor {
    inactive_timeout = 3
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = true
}


####################
### KEYBINDINGSS ###
####################

$mainMod = win

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, space, exec, $menu
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, I, exec, $browser
bind = $mainMod SHIFT, P, exec, hyprpicker -a
bind = $mainMod SHIFT, V, exec, cliphist list | wofi -S dmenu | cliphist decode | wl-copy
bind = $mainMod SHIFT, S, exec, hyprshot -m region --clipboard-only

bind = $mainMod SHIFT, Q, exit,
bind = $mainMod SHIFT, W, killactive,
bind = $mainMod SHIFT, F, workspaceopt, allfloat
bind = $mainMod, M, fullscreen
bind = $mainMod, F, togglefloating,

bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, R, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

binde = $mainMod CTRL, H, resizeactive,-20 0
binde = $mainMod CTRL, J, resizeactive,0 20
binde = $mainMod CTRL, K, resizeactive,0 -20
binde = $mainMod CTRL, L, resizeactive,20 0

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrulev2 = float, workspace:9
windowrulev2 = float, workspace:8
windowrulev2 = size 700 500, workspace:8
windowrulev2 = move cursor 25 25, workspace:8
windowrulev2 = opacity 0.95 0.7 1.0, workspace:8
windowrulev2 = float, workspace:7
windowrulev2 = size 415 900, workspace:7
windowrulev2 = move cursor 0 0, workspace:7

windowrulev2 = size 1200 700, class:(kitty)
windowrulev2 = move cursor 0 0, class:(kitty)

windowrulev2 = float, class:(org.gnome.Nautilus)
windowrulev2 = size 1200 700, class:(org.gnome.Nautilus)

windowrulev2 = float, class:(org.telegram.desktop)
windowrulev2 = size 1200 700, class:(org.telegram.desktop)

windowrulev2 = float, class:(betterbird)
windowrulev2 = size 1500 800, class:(betterbird)

windowrulev2 = float, class:(org.pulseaudio.pavucontrol)
windowrulev2 = size 1200 500, class:(org.pulseaudio.pavucontrol)

windowrulev2 = float, class:(com.nextcloud.desktopclient.nextcloud)
windowrulev2 = move cursor 0 3%, class:(com.nextcloud.desktopclient.nextcloud)
windowrulev2 = size 500 700, class:(com.nextcloud.desktopclient.nextcloud)

# bitwig looses focus on its dials. This solves it but stay catious!
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrulev2 = float, title:^(btop)$
windowrulev2 = float, class:(zoom)
windowrulev2 = float, class:(org.keepassxc.KeePassXC)
windowrulev2 = float, class:(blueman-manager)

# https://wiki.hyprland.org/Useful-Utilities/Screen-Sharing/
windowrulev2 = opacity 0.0 override, class:^(xwaylandvideobridge)$
windowrulev2 = noanim, class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus, class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1, class:^(xwaylandvideobridge)$
windowrulev2 = noblur, class:^(xwaylandvideobridge)$

# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules
workspace = 9, on-created-empty:[float] betterbird
workspace = 8, shadow:true, decorate:true
windowrulev2 = move 100 200, workspace:9, class:(betterbird)
