####################
### KEYBINDINGSS ###
####################

$mainMod = win

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, space, exec, uwsm app -- $menu
bind = $mainMod, Return, exec, uwsm app -- $terminal
bind = $mainMod, E, exec, uwsm app -- $fileManager
bind = $mainMod, I, exec, uwsm app -- $browser

bind = $mainMod SHIFT, P, exec, hyprpicker -a
bind = $mainMod SHIFT, V, exec, cliphist list | wofi -S dmenu | cliphist decode | wl-copy
bind = $mainMod , S, exec, hyprshot -m window -m active
bind = $mainMod SHIFT, S, exec, hyprshot -m region --clipboard-only
bind = $mainMod, N, exec, hyprland-switch-layout
bind = $mainMod SHIFT, Q, exec, uwsm stop

bind = $mainMod SHIFT, R, resizeactive, exact 2450 1080
bind = $mainMod SHIFT, W, killactive,
bind = $mainMod SHIFT, F, workspaceopt, allfloat
bind = $mainMod, M, fullscreen
bind = $mainMod, F, togglefloating,

bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, R, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

binde = $mainMod CTRL, H, resizeactive,-20 0
binde = $mainMod CTRL, J, resizeactive,0 20
binde = $mainMod CTRL, K, resizeactive,0 -20
binde = $mainMod CTRL, L, resizeactive,20 0

##############################
### WINDOWS AND WORKSPACES ###
##############################
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# Group Assignment
$POPUP_APPS = ^(albert|hyprland-share-picker|blueman-manager|org.pulseaudio.pavucontrol|nm-connection-editor|protonvpn-app|org.keepassxc.KeePassXC|org.gnome.Nautilus|org.telegram.desktop|betterbird)$
$MIN_SIZED_APPS = ^(org.pulseaudio.pavucontrol|nm-connection-editor|org.gnome.Nautilus|org.telegram.desktop|betterbird)$

# Fix XWayland Behaviour
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nofocus, class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Floating Rules
windowrulev2 = float, class:com.nextcloud.desktopclient.nextcloud
windowrulev2 = move cursor -3% -3%, class:com.nextcloud.desktopclient.nextcloud
windowrulev2 = move cursor -40% -50%, class:org.gnome.Nautilus
windowrulev2 = float, class:$POPUP_APPS
windowrulev2 = float, title:^(btop)$
# windowrulev2 = center, floating:1

# Additional Rules
# windowrulev2 = dimaround, class:$POPUP_APPS
# windowrulev2 = minsize 1000 600, class:$MIN_SIZED_APPS

# https://wiki.hyprland.org/Useful-Utilities/Screen-Sharing/
windowrulev2 = opacity 0.0 override, class:^(xwaylandvideobridge)$
windowrulev2 = noanim, class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus, class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1, class:^(xwaylandvideobridge)$
windowrulev2 = noblur, class:^(xwaylandvideobridge)$

layerrule = blur, notifications
layerrule = ignorezero, notifications

layerrule = blur, waybar
layerrule = ignorezero, waybar

# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules
workspace = 9, on-created-empty:[float] betterbird
windowrulev2 = move 100 200, workspace:9, class:(betterbird)

workspace = 8, shadow:true, decorate:true
windowrulev2 = float, workspace:8
windowrulev2 = opacity 0.9, workspace:8
