###################
### MY PROGRAMS ###
###################
# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$fileManager = nautilus
$menu = rofi -show drun
$browser = firefox
$cursor_theme = Bibata-Modern-TokyoNight
$gtk_theme = Kanagawa

################
### MONITORS ###
################
# See https://wiki.hyprland.org/Configuring/Monitors/

monitor = ,preferred,auto,1
monitor = DP-2,5120x1440@144.00Hz,auto,auto

#################
### AUTOSTART ###
#################

# GTK THEME
exec = gsettings set org.gnome.desktop.interface gtk-theme '$gtk_theme'
exec = gsettings set org.gnome.desktop.interface icon-theme '$gtk_theme'
exec = gsettings set org.gnome.desktop.interface cursor-theme '$cursor_theme'
exec = gsettings set org.gnome.desktop.interface text-scaling-factor 1

exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME
exec-once = systemctl --user start hyprpolkitagent

# clipboard history
exec-once = uwsm app -- wl-paste --type text --watch cliphist store
exec-once = uwsm app -- wl-paste --type image --watch cliphist store

### System Tray Applications ###
exec-once = uwsm app -- nm-applet
exec-once = uwsm app -- blueman-applet

# Window manager components
exec-once = uwsm app -- waybar
exec-once = uwsm app -- hypridle
exec-once = uwsm app -- hyprpaper
exec-once = uwsm app -- dunst

#exec-once = protonvpn-app

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 3
    no_border_on_floating = false

    col.active_border = rgba(5e548eff) rgba(1D2021ff) 25deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = true
    extend_border_grab_area = 5

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 5
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    allow_small_split = true
    orientation = center
    slave_count_for_center_master = 0
    # always_center_master = true
    new_status = slave
    new_on_active = none
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,de
    kb_variant =
    kb_model =
    kb_options = shift:both_shiftlock,ctrl:nocaps,altwin:swap_lalt_lwin,grp:ctrl_alt_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
	disable_while_typing = true
	drag_lock = true
	tap-and-drag = true
	middle_button_emulation = true
    }
}

cursor {
    inactive_timeout = 3
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = true
}

